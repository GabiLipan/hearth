<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Hearth — Family Finance</title>
    <script>
      // Whether this is the installed app, stamped before first paint.
      //
      // It decides the frame's height — `100dvh` resolves SHORT on a cold start
      // of an installed iOS PWA and does not correct until the viewport is
      // exercised by a scroll, which left the tab bar sitting well above the
      // bottom of the screen every time the app was opened. `100vh` needs no
      // settling and means the same thing in standalone, where there is no
      // dynamic browser chrome for it to be wrong about. See `.app-frame`.
      //
      // `navigator.standalone` first: iOS is the platform with the bug, and the
      // one whose support for the media query cannot be relied on.
      (function () {
        try {
          if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) {
            document.documentElement.dataset.standalone = '';
          }
        } catch (e) { /* a browser tab, then */ }
      })();

      // Stamp the resolved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('hearth-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          // And the browser chrome with it. `AppContext` keeps this in step
          // from here on; the point of doing it HERE is that it otherwise
          // arrives only once React has mounted, so a cold start — and the
          // whole of the install splash — showed the wrong colour above the
          // page and then corrected itself.
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = dark ? '#0d0d0d' : '#f9f9f7';
          document.head.appendChild(meta);
        } catch (e) { /* default light */ }
      })();
    </script>

    <!--
      The boot splash: the fire catching.

      ## Why it is here and not in a component

      The operating system's own splash cannot be animated — Android composites
      the launcher icon on `background_color`, iOS shows a still image — so the
      only animated opening available is the first thing the page itself paints.
      That has to be markup and CSS sitting in this file: anything shipped
      inside the bundle appears AFTER the blank page it exists to cover, which
      is a flash of empty app and then a splash, i.e. worse than none.

      ## Why the ground is the app's page colour

      This used to fill the screen with the mark's own dark, which meant a
      light-theme user's launch went dark tile → dark splash → light app: the
      join with the OS was invisible and the join with the APP, which is the one
      you look at for the rest of the session, was a flash. It paints `--page`
      instead — the same two values `index.css` defines, written out literally
      because the stylesheet is in the bundle and this has to be right on the
      first frame. The theme is already resolved above, before first paint, so
      `[data-theme]` is on the root by the time this rule is read; no attribute
      at all (the `catch` above) is light, which matches the app's default.

      The dark ground the mark was drawn against is now the ICON's own tile,
      standing beside the name rather than behind both — which is also what the
      manifest's `background_color` joins onto: the OS's dark tile shrinks into
      the icon rather than being replaced. The wordmark left that ground with
      the card, so it is `--ink` (both values, literal, same reason as `--page`)
      rather than the cream it used to be — cream on the light page is invisible.

      ## It is one continuous animation, not an entrance

      The icon breathes and the name ripples in step with it, and both go on for
      as long as the splash is there: nothing about the shape of the animation
      says how far along the boot is, because nothing here knows. A one-shot
      entrance had to guess a duration, and a boot slower than the guess left a
      still picture on screen for the rest of the wait — which reads as a hang,
      which is the one thing a splash exists to prevent.

      Both loops share `--pulse` and both are SAMPLED from the same sine at ten
      points, run `linear`, so the samples are the easing (the same discipline
      `origin-in` follows in `index.css`, for the same reason: stops chosen by
      hand animate at a near-constant speed through the middle, which is what
      "it feels linear" means). The letters carry a phase delay each, so the
      crest travels through the word behind the icon's — one motion in two
      places rather than two motions that happen to agree.

      ## What it must not do

      Wait for anything. It comes off when React has painted (`dismissSplash`,
      from `lib/splash.ts`), never when the session resolves or the first pull
      lands — a returning user's `ready` is set from the local cache before the
      network is consulted at all, and tying the splash to sync would hang the
      app on a fireplace on exactly the offline launches the cache exists for.
      The timeout below is the backstop for the case the bundle never arrives
      to call it: a splash nothing can remove is a brick.

      ## Sizing

      `position: fixed; inset: 0` rather than a height in `dvh`. The dynamic
      viewport units resolve SHORT on a cold start of the installed iOS app and
      do not correct until a scroll (see `.app-frame`), and a cold start is the
      only time this is ever on screen — it would be wrong every single time.
      A fixed box is the layout viewport itself, which needs no settling.

      The mark and the name together are 40% of the width, and every number
      inside them is a fraction of THAT rather than of the viewport: `.brand` is
      an inline-size container query container, so `cqw` is one hundredth of the
      row, and the icon, the gap and the type cannot drift out of proportion
      with each other however the row was sized. Which matters because it is
      clamped at both ends — 40vw is 150px on a small phone, where the name
      would be too small to read the ripple in, and 570px on a laptop, where a
      logo that size reads as an error page.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        /* `--page`, light. Kept in step with `index.css` by hand. */
        background: #f9f9f7;
      }
      :root[data-theme="dark"] #boot { background: #0d0d0d; }

      /* The mark and the name on one line, sized as a fraction of the screen
         and then measured from the inside. `cqw` is one hundredth of this row,
         so the three sizes below are stated as proportions of the lockup rather
         than of the viewport; where container queries are unsupported `cqw`
         falls back to the small-viewport unit, which for a 40vw row is close
         enough that the lockup is merely a shade wide. */
      #boot .brand {
        container-type: inline-size;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6cqw;
        width: clamp(150px, 40vw, 420px);
        /* One line, always: the wave is a horizontal reading and a name that
           wrapped under the icon would be a different picture entirely. */
        white-space: nowrap;
      }

      /* The app icon itself: the tile, not the fire alone. The corner is a
         superellipse rather than a quarter-circle, at roughly the 22% of the
         side Apple's own mask uses. `corner-shape` is the only way to say that
         without giving up `box-shadow` — `clip-path` would take the shadow and
         the hairline with it, since it clips everything the element paints.
         Where it is not supported the declaration is dropped and the radius
         alone applies, which is an ordinary rounded rectangle: the shape
         degrades, nothing breaks.

         The hairline is what separates the tile from the dark page, where the
         two colours are four points apart; on the light page the shadow does
         that job and the hairline is invisible. */
      #boot .icon {
        position: relative;
        flex: 0 0 auto;
        width: 25cqw;
        height: 25cqw;
        border-radius: 22%;
        corner-shape: squircle;
        overflow: hidden;
        background: linear-gradient(160deg, #2a2320 0%, #14100e 100%);
        box-shadow:
          inset 0 0 0 1px rgba(246, 227, 203, 0.08),
          0 4px 8px -2px rgba(0, 0, 0, 0.22),
          0 18px 36px -10px rgba(0, 0, 0, 0.28);
      }
      #boot .icon > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #boot .glow { opacity: 0.55; }

      #boot .word {
        margin: 0;
        font: 600 13cqw/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.16em;
        /* Letter-spacing is added AFTER the last letter too, so without this
           the lockup carries a sliver of empty space on its right and sits
           visibly left of the middle of the screen. */
        margin-right: -0.16em;
        text-transform: uppercase;
        /* `--ink`, light. Kept in step with `index.css` by hand. */
        color: #0b0b0b;
      }
      :root[data-theme="dark"] #boot .word { color: #ffffff; }
      /* Transformable, and each letter its own place in the wave. Inline boxes
         cannot be moved, so the spans have to be `inline-block`; letter-spacing
         still applies between them. */
      #boot .word > span {
        display: inline-block;
        will-change: transform;
        animation: boot-wave var(--pulse) linear infinite;
        /* A fourteenth of the cycle per letter, so the crest takes a bit over a
           third of one pulse to cross the word: slow enough to read as one
           travelling thing, fast enough that the far end is still visibly part
           of the same motion as the icon. */
        animation-delay: calc(var(--i) * var(--pulse) / 14);
      }

      /*
        ## The two loops

        One period, `--pulse`, and one curve: `(1 − cos 2πt) / 2` read at ten
        points and run `linear`, because the samples ARE the easing. A sine is
        the honest shape for something oscillating rather than arriving — the
        springs sampled elsewhere in the app are step responses, which is a
        different question — and hand-picked stops on a loop this slow are
        exactly where a constant-speed middle shows.

        Amplitudes are small on purpose. The icon reaches 1.05, which at 100px
        is two and a half pixels of growth per side; the letters lift 0.085em,
        which is under 2px at phone sizes. The motion has to say "still working"
        without becoming the thing you are looking at for the whole of a slow
        cold start.
      */
      @keyframes boot-pulse {
        0%   { transform: scale(1); }
        10%  { transform: scale(1.005); }
        20%  { transform: scale(1.017); }
        30%  { transform: scale(1.033); }
        40%  { transform: scale(1.045); }
        50%  { transform: scale(1.050); }
        60%  { transform: scale(1.045); }
        70%  { transform: scale(1.033); }
        80%  { transform: scale(1.017); }
        90%  { transform: scale(1.005); }
        100% { transform: scale(1); }
      }
      /* The fire brightening with the breath, on the same curve — the glow is
         light spilling past the opening, so it has to swell with it rather than
         sit at a constant while the tile moves. */
      @keyframes boot-fire {
        0%   { opacity: 0.50; }
        10%  { opacity: 0.53; }
        20%  { opacity: 0.60; }
        30%  { opacity: 0.68; }
        40%  { opacity: 0.75; }
        50%  { opacity: 0.78; }
        60%  { opacity: 0.75; }
        70%  { opacity: 0.68; }
        80%  { opacity: 0.60; }
        90%  { opacity: 0.53; }
        100% { opacity: 0.50; }
      }
      @keyframes boot-wave {
        0%   { transform: translateY(0); }
        10%  { transform: translateY(-0.008em); }
        20%  { transform: translateY(-0.029em); }
        30%  { transform: translateY(-0.056em); }
        40%  { transform: translateY(-0.077em); }
        50%  { transform: translateY(-0.085em); }
        60%  { transform: translateY(-0.077em); }
        70%  { transform: translateY(-0.056em); }
        80%  { transform: translateY(-0.029em); }
        90%  { transform: translateY(-0.008em); }
        100% { transform: translateY(0); }
      }
      /* The one thing that is not a loop, and the only place a duration is
         asserted: the lockup arriving over the page the OS handed us. */
      @keyframes boot-in {
        0%   { opacity: 0; transform: translateY(8px) scale(0.965); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes boot-out {
        0%   { opacity: 1; }
        100% { opacity: 0; }
      }

      #boot .brand { --pulse: 1700ms; animation: boot-in 420ms cubic-bezier(0.22, 0.7, 0.3, 1) both; }
      #boot .icon  { animation: boot-pulse var(--pulse) linear infinite; }
      #boot .glow  { animation: boot-fire var(--pulse) linear infinite; }

      /* `pointer-events: none` the instant it starts leaving, so the 220ms it
         spends fading cannot swallow a tap on the app already behind it. */
      #boot.leaving {
        animation: boot-out 220ms cubic-bezier(0.22, 0.7, 0.3, 1) both;
        pointer-events: none;
      }

      /* The state change stays legible — the mark is there and then the app is
         — but nothing breathes, travels or ripples. A perpetual animation is
         the case this query exists for. */
      @media (prefers-reduced-motion: reduce) {
        #boot .brand, #boot .icon, #boot .glow, #boot .word > span {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #boot .glow { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="brand">
        <div class="icon">
          <!-- Geometry from `BrandMark.tsx`: the arch runs y41–y127 and the
               hearthstone to y136, both centred on x90 of a 180 tile. Kept in
               step with it by hand, like `public/logo.svg` already is. -->
          <svg class="glow" viewBox="0 0 180 180">
            <defs>
              <filter id="bootBlur" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="13" />
              </filter>
            </defs>
            <path d="M52 127 V79 a38 38 0 0 1 76 0 v48 z" fill="#F4813A" filter="url(#bootBlur)" />
          </svg>
          <svg class="arch" viewBox="0 0 180 180">
            <defs>
              <radialGradient id="bootGlow" cx="50%" cy="58%" r="62%">
                <stop offset="0" stop-color="#FFD08A" />
                <stop offset="0.42" stop-color="#F4813A" />
                <stop offset="1" stop-color="#C0361A" />
              </radialGradient>
            </defs>
            <path d="M52 127 V79 a38 38 0 0 1 76 0 v48 z" fill="url(#bootGlow)" />
          </svg>
          <svg class="stone" viewBox="0 0 180 180">
            <rect x="34" y="127" width="112" height="9" rx="4.5" fill="#F6E3CB" opacity="0.22" />
          </svg>
        </div>
        <!-- One span per letter, each carrying its place in the wave. Written
             out rather than split in script for the reason the whole splash is
             in this file: nothing in the bundle has painted yet. -->
        <p class="word"><span style="--i:0">H</span><span style="--i:1">e</span><span style="--i:2">a</span><span style="--i:3">r</span><span style="--i:4">t</span><span style="--i:5">h</span></p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // The backstop, and the only part of the splash that does not depend on
      // the bundle. If `main.tsx` never arrives — a failed deploy, a chunk lost
      // to a flaky connection — nothing else would ever take this off, and an
      // app that opens on a fireplace and stays there looks broken in a way
      // that hides the actual fault. Deliberately long: it must never fire on
      // an ordinary slow start and pull the splash out from under a boot that
      // was going to succeed.
      setTimeout(function () {
        var el = document.getElementById('boot');
        if (el) el.remove();
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
