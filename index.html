<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Hearth — Family Finance</title>
    <script>
      // Stamp the resolved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('hearth-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          // And the browser chrome with it. `AppContext` keeps this in step
          // from here on; the point of doing it HERE is that it otherwise
          // arrives only once React has mounted, so a cold start — and the
          // whole of the install splash — showed the wrong colour above the
          // page and then corrected itself.
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = dark ? '#0d0d0d' : '#f9f9f7';
          document.head.appendChild(meta);
        } catch (e) { /* default light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
